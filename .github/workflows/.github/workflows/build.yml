name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web files
        run: |
          mkdir www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png www/
      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init PhoneBuy com.phonebuy.app --web-dir www
          npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneBuy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
